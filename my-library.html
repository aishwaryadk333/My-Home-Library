<style>
/* photographic scene art, for themes drawn straight from the inspiration images */
.scene-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(color-mix(in srgb, var(--bg) 74%, transparent), color-mix(in srgb, var(--bg) 88%, transparent)),
    var(--scene-img);
  background-size:cover; background-position:center;
  opacity:.55; transform:scale(1.04);
  transition:opacity var(--dur-3) var(--ease), background-image var(--dur-3) var(--ease);
  animation:sceneBreathe 42s ease-in-out infinite;
  filter:saturate(.95);
}
[data-mode="dark"] .scene-bg{ opacity:.7; filter:saturate(1.05) brightness(.88); }
@keyframes sceneBreathe{ 0%,100%{ transform:scale(1.04); } 50%{ transform:scale(1.1); } }
.reduced-motion .scene-bg{ animation:none; }

/* ============ THEME TOKENS ============ */
:root{
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --shadow-s:0 1px 3px rgba(30,20,10,.08), 0 1px 2px rgba(30,20,10,.06);
  --shadow-m:0 8px 24px -8px rgba(30,20,10,.22), 0 2px 8px rgba(30,20,10,.08);
  --shadow-l:0 24px 60px -20px rgba(20,14,8,.35);
  --font-display:'Fraunces', serif;
  --font-body:'Work Sans', sans-serif;
  --font-script:'Cormorant Garamond', serif;
  --dur-1:180ms; --dur-2:340ms; --dur-3:520ms;
  --ease:cubic-bezier(.22,1,.36,1);
  --glow-s:0 0 14px color-mix(in srgb, var(--accent) 45%, transparent);
  --glow-m:0 0 26px color-mix(in srgb, var(--accent) 42%, transparent);
  --glow-gold:0 0 16px color-mix(in srgb, var(--gold) 55%, transparent);
  --scene-img:none;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); transition:background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
  min-height:100vh; position:relative;
}
/* soft dreamlike aura wash behind everything */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 720px 520px at 8% -6%, color-mix(in srgb, var(--gold) 20%, transparent), transparent 60%),
    radial-gradient(ellipse 640px 520px at 96% 4%, color-mix(in srgb, var(--accent-2) 18%, transparent), transparent 60%),
    radial-gradient(ellipse 780px 620px at 50% 108%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 65%);
  opacity:.75; animation:auraDrift 26s ease-in-out infinite; transition:opacity var(--dur-3) var(--ease);
}
[data-mode="dark"] body::before{ opacity:1; }
@keyframes auraDrift{
  0%,100%{ transform:translate(0,0) scale(1); }
  50%{ transform:translate(-1.5%,1%) scale(1.03); }
}
/* twinkling starfield — most visible after dark, a hush of it by day */
.starfield{
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.16;
  transition:opacity var(--dur-3) var(--ease);
  background-image:
    radial-gradient(1.6px 1.6px at 8% 22%, var(--gold), transparent),
    radial-gradient(1.2px 1.2px at 22% 68%, var(--ink-faint), transparent),
    radial-gradient(1.6px 1.6px at 38% 12%, var(--ink-faint), transparent),
    radial-gradient(1.2px 1.2px at 55% 78%, var(--gold), transparent),
    radial-gradient(1.6px 1.6px at 68% 34%, var(--ink-faint), transparent),
    radial-gradient(1.2px 1.2px at 82% 58%, var(--gold), transparent),
    radial-gradient(1.6px 1.6px at 92% 18%, var(--ink-faint), transparent),
    radial-gradient(1.2px 1.2px at 14% 90%, var(--ink-faint), transparent);
  background-size:420px 420px;
  animation:starDrift 140s linear infinite;
}
.starfield.layer2{
  background-size:280px 280px; animation-duration:95s; animation-direction:reverse; opacity:.6;
  mix-blend-mode:normal;
}
[data-mode="dark"] .starfield{ opacity:.5; }
[data-mode="dark"] .starfield.layer2{ opacity:.32; animation-name:starDrift, starPulse; animation-duration:95s, 5.5s; }
@keyframes starDrift{ from{background-position:0 0;} to{background-position:420px 420px;} }
@keyframes starPulse{ 0%,100%{ filter:brightness(1); } 50%{ filter:brightness(1.7); } }
.reduced-motion body::before, .reduced-motion .starfield{ animation:none !important; }
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
.reduced-motion *{animation:none !important; transition:none !important;}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:600; margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
a{color:inherit;}
::selection{background:var(--accent); color:var(--surface);}

/* ============ LAYOUT ============ */
#app{max-width:1400px; margin:0 auto; padding:0 28px 80px;}
.topbar{
  position:sticky; top:0; z-index:40; background:var(--bg); backdrop-filter:blur(6px);
  padding:22px 0 14px; border-bottom:1px solid var(--line);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{width:38px; height:38px; flex:none;}
.brand-name{
  font-size:1.5rem; font-weight:600;
  background:linear-gradient(120deg, var(--ink) 20%, var(--accent) 55%, var(--gold) 90%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.brand-sub{font-family:var(--font-script); font-style:italic; color:var(--ink-soft); font-size:1rem; margin-top:-2px;}

.nav-tabs{display:flex; gap:4px; flex-wrap:wrap;}
.nav-tab{
  padding:8px 16px; border-radius:999px; border:1px solid transparent; background:transparent;
  color:var(--ink-soft); font-size:.88rem; font-weight:500; transition:all var(--dur-1) var(--ease);
}
.nav-tab:hover{background:var(--surface-2); color:var(--ink);}
.nav-tab.active{background:var(--ink); color:var(--bg); box-shadow:var(--glow-s);}

.top-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface); display:flex; align-items:center; justify-content:center;
  transition:all var(--dur-1) var(--ease); color:var(--ink);
}
.icon-btn:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-s), var(--glow-s);}
.btn{
  position:relative; overflow:hidden;
  padding:10px 20px; border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:var(--bg);
  font-size:.9rem; font-weight:600; display:inline-flex; align-items:center; gap:8px;
  transition:all var(--dur-1) var(--ease);
}
.btn::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(115deg, transparent 40%, color-mix(in srgb, var(--gold) 65%, transparent) 50%, transparent 60%);
  transform:translateX(-160%); transition:transform .7s var(--ease);
}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-m), var(--glow-m);}
.btn:hover::after{transform:translateX(160%);}
.btn.secondary{background:transparent; color:var(--ink); border-color:var(--line);}
.btn.secondary:hover{border-color:var(--accent); color:var(--accent);}
.btn.small{padding:6px 14px; font-size:.8rem;}
.btn.danger{background:var(--accent-2); border-color:var(--accent-2);}

.header-stats{padding:20px 0 6px;}
.header-stats h1{
  font-size:2.6rem; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:linear-gradient(120deg, var(--ink) 15%, var(--accent) 50%, var(--gold) 85%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.header-stats .stat-line{color:var(--ink-soft); font-size:1.02rem; margin-top:6px;}
.header-stats .stat-line b{color:var(--ink); font-weight:600;}
.stat-dot{color:var(--line);}

/* search + filter bar */
.controls-row{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin:22px 0 8px;}
.search-wrap{position:relative; flex:1 1 260px; min-width:200px;}
.search-wrap input{
  width:100%; padding:11px 16px 11px 40px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-size:.92rem; outline:none;
  transition:all var(--dur-1) var(--ease);
}
.search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-2-soft);}
.search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--ink-faint);}
select.select-ctl, .select-ctl{
  padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:.85rem; outline:none;
}
.view-switch{display:flex; background:var(--surface-2); border-radius:999px; padding:3px; gap:2px;}
.view-switch button{
  border:none; background:transparent; padding:7px 12px; border-radius:999px; color:var(--ink-soft);
  font-size:.8rem; font-weight:600; display:flex; align-items:center; gap:6px; transition:all var(--dur-1) var(--ease);
}
.view-switch button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-s);}

.filter-chips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px;}
.chip{
  padding:6px 13px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  font-size:.78rem; color:var(--ink-soft); cursor:pointer; transition:all var(--dur-1) var(--ease); user-select:none;
}
.chip:hover{border-color:var(--accent);}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:600; box-shadow:var(--glow-s);}
.chip.clear{color:var(--accent-2); border-style:dashed;}

/* ============ BOOK GRID ============ */
.section{margin-top:44px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
.section-head h2{font-size:1.5rem; display:flex; align-items:center; gap:9px;}
.section-head h2 .sec-flourish{width:17px; height:17px; color:var(--gold); flex:none; opacity:.85; animation:twinkle 3.8s ease-in-out infinite;}
.section-head .see-all{font-size:.82rem; color:var(--accent); font-weight:600;}

.book-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:26px 20px;}
.book-grid.compact{grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:18px 14px;}
.book-card{
  cursor:pointer; opacity:0; animation:riseIn var(--dur-3) var(--ease) forwards;
}
@keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.book-cover{
  position:relative; aspect-ratio:2/3; border-radius:6px; overflow:hidden; background:var(--surface-2);
  box-shadow:var(--shadow-s); transition:transform var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
  display:flex; align-items:flex-end;
}
.book-cover::after{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:2;
  background:linear-gradient(115deg, transparent 42%, color-mix(in srgb, var(--gold) 60%, transparent) 50%, transparent 58%);
  transform:translateX(-160%); transition:transform .85s var(--ease);
}
.book-card:hover .book-cover{transform:translateY(-6px) rotate(-.6deg); box-shadow:var(--shadow-m), var(--glow-m);}
.book-card:hover .book-cover::after{ transform:translateX(160%); }
.book-cover img{width:100%; height:100%; object-fit:cover; display:block;}
.cover-fallback{
  width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:14px; text-align:center; background:linear-gradient(150deg,var(--surface-2),var(--bg-soft));
  border:1px solid var(--line); position:relative; overflow:hidden;
}
.cover-fallback::before{
  content:''; position:absolute; inset:0; opacity:.5;
  background-image:
    radial-gradient(1.4px 1.4px at 20% 25%, var(--gold), transparent),
    radial-gradient(1.1px 1.1px at 70% 60%, var(--gold), transparent),
    radial-gradient(1.4px 1.4px at 45% 80%, var(--accent), transparent),
    radial-gradient(1.1px 1.1px at 85% 20%, var(--accent), transparent);
}
.cover-fallback .ff-title{font-family:var(--font-display); font-size:.82rem; font-weight:600; line-height:1.25; color:var(--ink);}
.cover-fallback .ff-author{font-size:.68rem; color:var(--ink-faint); margin-top:6px; font-style:italic;}
.badge-row{position:absolute; top:6px; left:6px; display:flex; gap:4px; flex-wrap:wrap; max-width:calc(100% - 12px);}
.badge{
  font-size:.62rem; font-weight:700; padding:3px 7px; border-radius:5px; background:rgba(20,14,8,.62); color:#fff;
  backdrop-filter:blur(2px); letter-spacing:.02em;
}
.badge.fav{background:var(--accent-2);}
.badge.lent{background:#8a6a3a;}
.status-tab{
  position:absolute; bottom:0; left:0; right:0; padding:4px 8px; font-size:.62rem; font-weight:700;
  text-align:center; letter-spacing:.03em; text-transform:uppercase; color:#fff;
}
.status-tab.read{background:rgba(58,90,52,.85);}
.status-tab.reading{background:rgba(184,137,74,.88);}
.status-tab.unread{background:rgba(60,50,40,.55);}
.status-tab.dnf{background:rgba(120,60,60,.7);}
.status-tab.hold{background:rgba(100,90,70,.6);}
.book-meta{margin-top:9px;}
.book-meta .bt{font-size:.85rem; font-weight:600; line-height:1.28; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.book-meta .ba{font-size:.74rem; color:var(--ink-soft); margin-top:2px;}
.book-meta .brate{font-size:.72rem; color:var(--gold); margin-top:3px;}
.book-grid.compact .bt{font-size:.72rem;}
.book-grid.compact .ba{font-size:.64rem;}

/* bookshelf view */
.shelf-wrap{display:flex; flex-direction:column; gap:6px;}
.shelf-row{
  position:relative; background:linear-gradient(180deg, var(--shelf-wood) 0%, var(--shelf-wood) 82%, var(--shelf-wood-dark) 100%);
  border-radius:6px; padding:14px 16px 20px; box-shadow:inset 0 -6px 10px rgba(0,0,0,.25), var(--shadow-s);
}
.shelf-books{display:flex; align-items:flex-end; gap:8px; overflow-x:auto; padding-bottom:2px; min-height:150px;}
.shelf-book{flex:none; cursor:pointer; opacity:0; animation:riseIn var(--dur-3) var(--ease) forwards;}
.shelf-book .book-cover{width:78px; box-shadow:0 6px 10px rgba(0,0,0,.35);}
.shelf-book:hover .book-cover{transform:translateY(-8px) rotate(-1deg);}

/* list view */
.book-list{border-top:1px solid var(--line);}
.list-row{
  display:grid; grid-template-columns:44px 1fr 130px 110px 90px 90px; gap:14px; align-items:center;
  padding:12px 6px; border-bottom:1px solid var(--line); cursor:pointer; transition:background var(--dur-1);
  font-size:.85rem;
}
.list-row:hover{background:var(--surface);}
.list-row.head{font-weight:700; color:var(--ink-soft); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; cursor:default;}
.list-row.head:hover{background:transparent;}
.list-cover{width:34px; height:50px; border-radius:3px; overflow:hidden; background:var(--surface-2);}
.list-cover img{width:100%; height:100%; object-fit:cover;}
.list-title{font-weight:600;}
.list-sub{color:var(--ink-soft); font-size:.78rem;}
@media(max-width:760px){.list-row{grid-template-columns:40px 1fr 80px;} .list-row .col-pub,.list-row .col-fmt{display:none;}}

.empty-state{
  text-align:center; padding:60px 20px; border:1px dashed var(--line); border-radius:var(--radius-l);
  color:var(--ink-soft); font-family:var(--font-script); font-size:1.25rem; font-style:italic; background:var(--bg-soft);
}
.empty-state .es-sub{display:block; margin-top:8px; font-family:var(--font-body); font-style:normal; font-size:.82rem; color:var(--ink-faint);}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,14,8,.5); backdrop-filter:blur(3px); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; animation:fadeIn var(--dur-2) var(--ease) forwards;
}
@keyframes fadeIn{to{opacity:1;}}
.modal{
  background:var(--surface); border-radius:var(--radius-l); max-width:880px; width:100%; max-height:88vh; overflow-y:auto;
  box-shadow:var(--shadow-l); transform:translateY(16px) scale(.98); opacity:0; animation:modalIn var(--dur-2) var(--ease) forwards;
  padding:32px;
}
@keyframes modalIn{to{transform:translateY(0) scale(1); opacity:1;}}
.modal.narrow{max-width:520px;}
.modal-close{position:sticky; top:0; float:right; margin-left:12px;}
.modal h2{font-size:1.7rem; margin-bottom:4px;}
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px;}
.field-grid.single{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:6px;}
.field.span2{grid-column:1/-1;}
.field label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
.field input, .field select, .field textarea{
  padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--bg-soft); color:var(--ink);
  font-size:.9rem; outline:none; transition:border var(--dur-1);
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:70px; font-family:var(--font-body);}
.field-check{flex-direction:row; align-items:center; gap:8px;}
.field-check input{width:auto;}
.form-tabs{display:flex; gap:6px; margin-top:14px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.form-tab{padding:9px 4px; margin-right:16px; border-bottom:2px solid transparent; color:var(--ink-soft); font-size:.82rem; font-weight:600; background:none; border-top:none;border-left:none;border-right:none;}
.form-tab.active{color:var(--accent); border-color:var(--accent);}
.form-pane{display:none; padding-top:16px;}
.form-pane.active{display:block;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:26px; padding-top:18px; border-top:1px solid var(--line);}

/* detail view */
.detail-head{display:grid; grid-template-columns:180px 1fr; gap:26px;}
@media(max-width:560px){.detail-head{grid-template-columns:1fr;}}
.detail-cover{width:100%; aspect-ratio:2/3; border-radius:8px; overflow:hidden; box-shadow:var(--shadow-m);}
.detail-cover img{width:100%; height:100%; object-fit:cover;}
.detail-title{font-size:1.7rem;}
.detail-author{font-family:var(--font-script); font-style:italic; font-size:1.2rem; color:var(--ink-soft); margin-top:2px;}
.detail-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;}
.tag{padding:4px 11px; border-radius:999px; background:var(--surface-2); font-size:.72rem; color:var(--ink-soft);}
.tag.status{background:var(--accent); color:var(--surface); font-weight:600;}
.detail-quick{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;}
.star-row{display:flex; gap:3px; margin-top:8px;}
.star{cursor:pointer; font-size:1.3rem; color:var(--line); transition:color var(--dur-1), filter var(--dur-1);}
.star.filled{color:var(--gold); filter:drop-shadow(0 0 5px color-mix(in srgb, var(--gold) 65%, transparent));}
.info-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px 20px; margin-top:26px; padding-top:22px; border-top:1px solid var(--line);}
.info-item .il{font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:700;}
.info-item .iv{font-size:.9rem; margin-top:3px;}
.notes-block{margin-top:22px; padding-top:20px; border-top:1px solid var(--line); white-space:pre-wrap; font-size:.9rem; line-height:1.6; color:var(--ink-soft); font-family:var(--font-script); font-size:1.05rem;}

/* series */
.series-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px; margin-bottom:16px;}
.series-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
.series-name{font-size:1.15rem;}
.series-author{color:var(--ink-soft); font-size:.82rem; font-family:var(--font-script); font-style:italic;}
.progress-bar{height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:10px;}
.progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width var(--dur-3) var(--ease);}
.series-books{display:flex; gap:10px; margin-top:14px; overflow-x:auto; padding-bottom:4px;}
.series-book{flex:none; width:70px; text-align:center;}
.series-book .book-cover{width:70px; opacity:1;}
.series-book.missing .book-cover{opacity:.35; filter:grayscale(1);}
.series-book .snum{font-size:.65rem; color:var(--ink-faint); margin-top:4px;}

/* stats */
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:16px; margin-bottom:36px;}
.stat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px;}
.stat-card .sv{font-family:var(--font-display); font-size:2rem; font-weight:600;}
.stat-card .sl{font-size:.76rem; color:var(--ink-soft); margin-top:2px;}
.bars-panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px; margin-bottom:20px;}
.bars-panel h3{font-size:1rem; margin-bottom:16px;}
.bar-row{display:grid; grid-template-columns:110px 1fr 40px; align-items:center; gap:10px; margin-bottom:9px; font-size:.8rem;}
.bar-track{height:12px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:99px; transition:width var(--dur-3) var(--ease);}

/* settings/theme picker */
.theme-swatches{display:flex; gap:12px; flex-wrap:wrap; margin-top:10px;}
.theme-swatch{
  width:56px; height:56px; border-radius:50%; cursor:pointer; border:3px solid transparent;
  display:flex; align-items:center; justify-content:center; transition:all var(--dur-1) var(--ease);
  position:relative;
}
.theme-swatch.active{border-color:var(--ink); box-shadow:0 0 0 4px color-mix(in srgb, var(--gold) 35%, transparent), var(--glow-gold);}
.theme-swatch:hover{transform:scale(1.08) rotate(-3deg); box-shadow:var(--glow-gold);}
.mode-toggle{display:flex; align-items:center; gap:10px; margin-top:18px;}
.lamp-btn{
  width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; transition:all var(--dur-2) var(--ease);
}
.lamp-btn svg{width:26px; height:26px;}
[data-mode="dark"] .lamp-btn{ box-shadow:var(--glow-gold); border-color:color-mix(in srgb, var(--gold) 50%, var(--line)); }

footer{
  text-align:center; margin-top:70px; padding-top:24px; border-top:1px solid var(--line); color:var(--ink-faint);
  font-size:.85rem; font-family:var(--font-script); font-style:italic; position:relative; z-index:1;
  display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
}
footer .foot-flourish{width:15px; height:15px; color:var(--gold); flex:none; opacity:.8; animation:twinkle 3.4s ease-in-out infinite;}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg);
  padding:12px 22px; border-radius:999px; font-size:.85rem; font-weight:500; opacity:0; z-index:200; box-shadow:var(--shadow-m);
  transition:all var(--dur-2) var(--ease); pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.lend-badge-note{font-size:.78rem; padding:10px 14px; background:var(--accent-2-soft); border-radius:var(--radius-s); margin-top:10px; color:var(--ink);}

@media(max-width:640px){
  #app{padding:0 16px 60px;}
  .field-grid{grid-template-columns:1fr;}
  .modal{padding:22px;}
}

/* ============ AMBIENT MAGICAL DECORATION ============ */
#ambientLayer{
  position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;
}
#app, .topbar{position:relative; z-index:1;}
.ambient-item{
  position:absolute; color:var(--accent); opacity:.28; will-change:transform, opacity;
  animation-name:driftFloat; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
}
.ambient-item.gold{ color:var(--gold); }

async function sget(key, fallback){
  try{
    const r = await window.storage.get(key, false);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function sset(key, value){

const AMBIENT_SETS = {

};

  amber:'feather', emerald:'leaf', violet:'sparkle', rosewood:'heart', sage:'leaf', blossom:'flower', skyblue:'star',
  lily:'flower', firefly:'firefly', celestial:'star', gilded:'butterfly'
};
function currentFlourish(cls){
  const key = FLOURISH_ICON[state.settings.theme] || 'sparkle';
  return `<span class="${cls}">${DECOR[key]}</span>`;
}
function sectionFlourish(){
  return `<span class="sec-flourish">${DECOR['sparkle']}</span>`;
}
function renderAmbientDecor(){
  let layer = document.getElementById('ambientLayer');
  if(!layer){ layer = document.createElement('div'); layer.id='ambientLayer'; document.body.insertBefore(layer, document.body.firstChild); }
  const set = AMBIENT_SETS[state.settings.theme] || ['sparkle','star','leaf','firefly'];
  const count = 24;
  let html = '';
  for(let i=0;i<count;i++){
    const icon = set[i % set.length];
    const size = 14 + Math.round(Math.random()*24);
    const top = Math.round(Math.random()*96);
    const left = Math.round(Math.random()*96);
    const dur = (9 + Math.random()*15).toFixed(1);
    const delay = (Math.random()*12).toFixed(1);
    const twinkly = (icon==='star'||icon==='sparkle'||icon==='firefly') ? 'twinkle' : '';
    const glow = (icon==='firefly'||icon==='sparkle'||icon==='star') ? 'glow' : '';
    const gold = (icon==='sparkle'||icon==='star'||icon==='firefly') && Math.random()>0.4 ? 'gold' : '';
    html += `<div class="ambient-item ${twinkly} ${glow} ${gold}" style="top:${top}vh;left:${left}vw;width:${size}px;height:${size}px;animation-duration:${dur}s;animation-delay:${delay}s;">${DECOR[icon]}</div>`;
  }
  layer.innerHTML = html;
}

/* ============== HELPERS ============== */
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return ''; try{ return new Date(d+'T00:00:00').toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});}catch(e){return d;} }
function coverFallbackNode(title, author){
  const div = document.createElement('div');
  div.className = 'cover-fallback';
  const t = document.createElement('div'); t.className='ff-title'; t.textContent = title || 'Untitled';
  const a = document.createElement('div'); a.className='ff-author'; a.textContent = author || '';
  div.appendChild(t); div.appendChild(a);
  return div;
}
function coverEl(book, sizeClass){
  if(book.cover){
    return `<div class="book-cover">${badgesHTML(book)}<img src="${esc(book.cover)}" alt="" data-title="${esc(book.title||'')}" data-author="${esc(book.author||'')}" onerror="this.replaceWith(coverFallbackNode(this.dataset.title,this.dataset.author))">${statusTabHTML(book)}</div>`;
  }
  return `<div class="book-cover">${badgesHTML(book)}${fallbackCoverHTML(book.title,book.author)}${statusTabHTML(book)}</div>`;
}
function fallbackCoverHTML(title, author){
  return `<div class="cover-fallback"><div class="ff-title">${esc(title||'Untitled')}</div><div class="ff-author">${esc(author||'')}</div></div>`;
}
function badgesHTML(book){
  let b = '<div class="badge-row">';
  if(book.favorite) b += '<span class="badge fav">♥</span>';
  if(book.lending && book.lending.active) b += '<span class="badge lent">Lent</span>';
  if(book.firstEdition) b += '<span class="badge">1st Ed</span>';
  if(book.signed) b += '<span class="badge">Signed</span>';
  b += '</div>';
  return b;
}
function statusTabHTML(book){
  const map = {'Read':'read','Reading':'reading','Unread':'unread','DNF':'dnf','On Hold':'hold'};
  const cls = map[book.status] || 'unread';
  return `<div class="status-tab ${cls}">${esc(book.status||'Unread')}</div>`;
}
function starsHTML(rating, interactive, bookId){
  let h = '<div class="star-row">';
  for(let i=1;i<=5;i++){
    h += `<span class="star ${i<=(rating||0)?'filled':''}" ${interactive?`onclick="setRating('${bookId}',${i})"`:''}>★</span>`;
  }
  h += '</div>';
  return h;
}

/* ============== DERIVED DATA ============== */
function libraryStats(){
  const b = state.books;
  const total = b.length;
  const read = b.filter(x=>x.status==='Read').length;
  const unread = b.filter(x=>x.status==='Unread').length;
  const reading = b.filter(x=>x.status==='Reading').length;
  const seriesSet = new Set(b.filter(x=>x.series).map(x=>x.series));
  const pages = b.reduce((s,x)=>s+(parseInt(x.pageCount)||0),0);
  return {total, read, unread, reading, series: seriesSet.size, pages};
}
function filteredSortedBooks(){
  let b = state.books.slice();
  const q = state.search.trim().toLowerCase();
  if(q){
    b = b.filter(x => [x.title,x.author,x.isbn13,x.isbn10,x.series,x.genre,x.publisher,(x.tags||[]).join(' ')]
      .filter(Boolean).join(' ').toLowerCase().includes(q));
  }
  const f = state.filters;
  if(f.status) b = b.filter(x=>x.status===f.status);
  if(f.format) b = b.filter(x=>x.format===f.format);
  if(f.genre) b = b.filter(x=>x.genre===f.genre);
  if(f.flag==='favorite') b = b.filter(x=>x.favorite);
  if(f.flag==='signed') b = b.filter(x=>x.signed);
  if(f.flag==='special') b = b.filter(x=>x.format==='Special Edition');
  if(f.flag==='first') b = b.filter(x=>x.firstEdition);
  if(f.seriesOnly==='series') b = b.filter(x=>x.series);
  if(f.seriesOnly==='standalone') b = b.filter(x=>!x.series);
  switch(state.sortBy){
    case 'title-az': b.sort((a,z)=>(a.title||'').localeCompare(z.title||'')); break;
    case 'title-za': b.sort((a,z)=>(z.title||'').localeCompare(a.title||'')); break;
    case 'author': b.sort((a,z)=>(a.author||'').localeCompare(z.author||'')); break;
    case 'rating': b.sort((a,z)=>(z.rating||0)-(a.rating||0)); break;
    case 'purchase': b.sort((a,z)=>(z.datePurchased||'').localeCompare(a.datePurchased||'')); break;
    case 'pubdate': b.sort((a,z)=>(z.pubDate||'').localeCompare(a.pubDate||'')); break;
    case 'pages': b.sort((a,z)=>(parseInt(z.pageCount)||0)-(parseInt(a.pageCount)||0)); break;
    case 'status': b.sort((a,z)=>(a.status||'').localeCompare(z.status||'')); break;
    case 'series': b.sort((a,z)=>(a.series||'zzz').localeCompare(z.series||'zzz') || (a.seriesNumber||0)-(z.seriesNumber||0)); break;
    case 'price': b.sort((a,z)=>(parseFloat(z.price)||0)-(parseFloat(a.price)||0)); break;
    default: b.sort((a,z)=>(z.dateAdded||'').localeCompare(a.dateAdded||''));
  }
  return b;
}
function seriesGroups(){
  const groups = {};
  state.books.filter(x=>x.series).forEach(b=>{
    if(!groups[b.series]) groups[b.series] = [];
    groups[b.series].push(b);
  });
  return groups;
}

function seriesCardHTML(name, books){
  const sorted = books.slice().sort((a,z)=>(a.seriesNumber||0)-(z.seriesNumber||0));
  const total = (state.seriesMeta[name] && state.seriesMeta[name].total) || sorted.length;
  const read = sorted.filter(b=>b.status==='Read').length;
  const pct = Math.round((sorted.length/total)*100);
  const author = sorted[0].author||'';
  let slots = [];
  const known = new Set(sorted.map(b=>b.seriesNumber).filter(Boolean));
  const maxNum = Math.max(total, ...sorted.map(b=>b.seriesNumber||0));
  for(let n=1;n<=maxNum;n++){
    const owned = sorted.find(b=>b.seriesNumber===n);
    slots.push(owned ? {owned:true, book:owned} : {owned:false, num:n});
  }
  if(slots.length===0) slots = sorted.map(b=>({owned:true, book:b}));
  return `<div class="series-card">
    <div class="series-top">
      <div><div class="series-name">${esc(name)}</div><div class="series-author">${esc(author)}</div></div>
      <div style="text-align:right">
        <div style="font-size:.85rem;font-weight:600">${sorted.length} of
          <input type="number" min="${sorted.length}" value="${total}" data-series-total="${esc(name)}" style="width:44px;border:1px solid var(--line);border-radius:6px;padding:1px 4px;background:var(--bg-soft);color:var(--ink);font-size:.85rem;"> owned</div>
        <div style="font-size:.75rem;color:var(--ink-soft)">${read} read · ${pct}% complete</div>
      </div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="series-books">
      ${slots.map(s=> s.owned
        ? `<div class="series-book" data-open-book="${s.book.id}">${coverEl(s.book)}<div class="snum">#${s.book.seriesNumber||'—'}</div></div>`
        : `<div class="series-book missing"><div class="book-cover">${fallbackCoverHTML('Not owned','')}</div><div class="snum">#${s.num}</div></div>`
      ).join('')}
    </div>
  </div>`;
}

/* ============== STATS ============== */
function statsViewHTML(){
  const b = state.books;
  if(b.length===0) return `<div class="section" style="margin-top:30px"><div class="empty-state">${currentFlourish('empty-flourish')}No statistics yet.<span class="es-sub">Add a few books and this page will come alive.</span></div></div>`;
  const s = libraryStats();
  const avgRating = (b.filter(x=>x.rating).reduce((a,x)=>a+x.rating,0) / (b.filter(x=>x.rating).length||1)).toFixed(1);
  const authors = new Set(b.map(x=>x.author).filter(Boolean)).size;
  const hard = b.filter(x=>x.format==='Hardcover').length;
  const paper = b.filter(x=>x.format==='Paperback').length;
  const genreCounts = {};
  b.forEach(x=>{ if(x.genre) genreCounts[x.genre]=(genreCounts[x.genre]||0)+1; });
  const genreEntries = Object.entries(genreCounts).sort((a,z)=>z[1]-a[1]).slice(0,8);
  const maxGenre = Math.max(1,...genreEntries.map(e=>e[1]));
  const yearCounts = {};
  b.forEach(x=>{ if(x.datePurchased){ const y=x.datePurchased.slice(0,4); yearCounts[y]=(yearCounts[y]||0)+1; }});
  const years = Object.keys(yearCounts).sort();
  const maxYear = Math.max(1,...Object.values(yearCounts));
  const fmtCounts = {}; b.forEach(x=>{ if(x.format) fmtCounts[x.format]=(fmtCounts[x.format]||0)+1; });
  const maxFmt = Math.max(1,...Object.values(fmtCounts));

  return `<div class="section" style="margin-top:30px">
    <div class="section-head"><h2>${sectionFlourish()}Collection Statistics</h2></div>
    <div class="stats-grid">
      ${statCard(s.total,'Total Books')}
      ${statCard(s.read,'Read')}
      ${statCard(s.unread,'Unread')}
      ${statCard(s.reading,'Currently Reading')}
      ${statCard(s.pages.toLocaleString(),'Total Pages Owned')}
      ${statCard(avgRating,'Average Rating')}
      ${statCard(authors,'Authors')}
      ${statCard(s.series,'Series')}
    </div>
    <div class="bars-panel">
      <h3>Genres</h3>
      ${genreEntries.map(([g,c])=>barRow(g,c,maxGenre)).join('') || '<p style="color:var(--ink-soft);font-size:.85rem">Add genres to your books to see this chart.</p>'}
    </div>
    <div class="bars-panel">
      <h3>Format</h3>
      ${Object.entries(fmtCounts).map(([g,c])=>barRow(g,c,maxFmt)).join('') || '<p style="color:var(--ink-soft);font-size:.85rem">No format data yet.</p>'}
      <p style="font-size:.78rem;color:var(--ink-soft);margin-top:8px">${hard} hardcover · ${paper} paperback</p>
    </div>
    <div class="bars-panel">
      <h3>Books Purchased by Year</h3>
      ${years.length? years.map(y=>barRow(y,yearCounts[y],maxYear)).join('') : '<p style="color:var(--ink-soft);font-size:.85rem">Add purchase dates to see collection growth.</p>'}
    </div>
  </div>`;
}
function statCard(v,l){ return `<div class="stat-card"><div class="sv">${v}</div><div class="sl">${esc(l)}</div></div>`; }
function barRow(label,count,max){
  return `<div class="bar-row"><span>${esc(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round((count/max)*100)}%"></div></div><span>${count}</span></div>`;
}

/* ============== EVENT BINDING ============== */
function bindGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.view = el.getAttribute('data-nav'); render(); window.scrollTo({top:0,behavior:state.settings.reducedMotion?'auto':'smooth'}); });
  });
  const addBtn = document.getElementById('addBookBtn');
  if(addBtn) addBtn.addEventListener('click', ()=>openBookForm(null));

  document.querySelectorAll('[data-section-toggle]').forEach(el=>{

function infoItem(label, value){
  if(!value) return '';
  return `<div class="info-item"><div class="il">${esc(label)}</div><div class="iv">${esc(value)}</div></div>`;
}
function setRating(id, val){
  const b = state.books.find(x=>x.id===id); if(!b) return;
  b.rating = b.rating===val ? val-1 : val;
  if(b.rating < 0) b.rating = 0;
  saveBooks();
  document.querySelectorAll('.modal-overlay .star-row .star').forEach((s,i)=>s.classList.toggle('filled', i < b.rating));
}
function cycleStatusPrompt(b){
  const opts = STATUSES.map((s,i)=>`${i+1}. ${s}`).join('\n');
  const pick = prompt('Set status:\n'+opts, b.status||'Unread');
  if(pick===null) return;
  const match = STATUSES.find(s=>s.toLowerCase()===pick.trim().toLowerCase()) || STATUSES[parseInt(pick)-1];
  if(match){
    b.status = match;
    if(match==='Reading' && !b.dateStarted) b.dateStarted = todayStr();
    if(match==='Read' && !b.dateFinished) b.dateFinished = todayStr();
    saveBooks(); render(); toast('Status updated to '+match);
  }
}
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function doIsbnLookup(overlay){
  const isbn = overlay.querySelector('#isbnLookup').value.replace(/[-\s]/g,'');
  const statusEl = overlay.querySelector('#isbnStatus');
  if(!isbn){ statusEl.textContent='Enter an ISBN first.'; return; }
  statusEl.textContent = 'Searching…';
  try{
    const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
    const data = await res.json();
    const info = data['ISBN:'+isbn];
    if(!info){ statusEl.textContent = 'No match found — enter details manually.'; return; }
    const g = id=>overlay.querySelector('#'+id);
    if(info.title) g('f_title').value = info.title;
    if(info.authors && info.authors.length) g('f_author').value = info.authors.map(a=>a.name).join(', ');
    if(info.publishers && info.publishers.length) g('f_publisher').value = info.publishers[0].name;
    if(info.publish_date) g('f_pubDate').value = normalizeDate(info.publish_date);
    if(info.number_of_pages) g('f_pageCount').value = info.number_of_pages;
    if(info.cover && info.cover.large) g('f_cover').value = info.cover.large;
    if(isbn.length===13) g('f_isbn13').value = isbn; else g('f_isbn10').value = isbn;
    statusEl.textContent = 'Found it! Details filled in — feel free to edit anything.';
  }catch(e){
    statusEl.textContent = 'Lookup failed — you can still add details manually.';
  }
}
function normalizeDate(s){
  const d = new Date(s);
  if(isNaN(d)) return '';
  return d.toISOString().slice(0,10);
}

  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',()=>overlay.remove()));
  overlay.querySelector('#wSave').addEventListener('click', ()=>{
    const g = id=>overlay.querySelector('#'+id);
    const title = g('w_title').value.trim();
    if(!title){ toast('Give this wishlist item a title'); return; }
    const item = Object.assign({}, w, {
      title, author:g('w_author').value, cover:g('w_cover').value, isbn:g('w_isbn').value,
      format:g('w_format').value, edition:g('w_edition').value, priority:g('w_priority').value,
      price:g('w_price').value, notes:g('w_notes').value
    });
    if(existing){ const idx=state.wishlist.findIndex(x=>x.id===w.id); state.wishlist[idx]=item; }
    else state.wishlist.push(item);
    saveWishlist(); overlay.remove(); render(); toast(existing?'Wishlist item updated':'Added to wishlist');
  });
  const del = overlay.querySelector('#wDelete');
  if(del) del.addEventListener('click', ()=>{ state.wishlist = state.wishlist.filter(x=>x.id!==w.id); saveWishlist(); overlay.remove(); render(); toast('Removed from wishlist'); });
  const move = overlay.querySelector('#wMoveToLibrary');
  if(move) move.addEventListener('click', ()=>{
    state.wishlist = state.wishlist.filter(x=>x.id!==w.id); saveWishlist();
    overlay.remove();
    openBookForm({ id:uid(), title:w.title, author:w.author, cover:w.cover, isbn13:w.isbn, format:w.format, edition:w.edition,
      price:w.price, notes:w.notes, status:'Unread', dateAdded:new Date().toISOString(), tags:[] });
  });
}

/* ============== IMPORT / EXPORT ============== */
function exportJSON(){
  const data = JSON.stringify({books:state.books, wishlist:state.wishlist, seriesMeta:state.seriesMeta}, null, 2);
  downloadFile(data, 'my-library-export.json', 'application/json');
  toast('Library exported as JSON');
}
function exportCSV(){
  const cols = ['title','author','isbn13','isbn10','publisher','pubDate','pageCount','format','status','rating','series','seriesNumber','genre','datePurchased','price','room','bookcase','shelfName','favorite','signed','firstEdition','notes'];
  const rows = [cols.join(',')];
  state.books.forEach(b=>{
    rows.push(cols.map(c=>csvEsc(b[c])).join(','));
  });
  downloadFile(rows.join('\n'), 'my-library-export.csv', 'text/csv');
  toast('Library exported as CSV');
}
function csvEsc(v){
  if(v===undefined||v===null) v='';
  v = String(v);
  if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function downloadFile(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url);
}
function handleImport(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      if(file.name.endsWith('.json')){
        const data = JSON.parse(ev.target.result);
        if(data.books){ state.books = state.books.concat(data.books.map(b=>Object.assign({},b,{id:b.id||uid()}))); }
        if(data.wishlist){ state.wishlist = state.wishlist.concat(data.wishlist.map(w=>Object.assign({},w,{id:w.id||uid()}))); }
        if(data.seriesMeta){ Object.assign(state.seriesMeta, data.seriesMeta); }
      } else {
        const lines = ev.target.result.split(/\r?\n/).filter(Boolean);
        const cols = parseCsvLine(lines[0]);
        for(let i=1;i<lines.length;i++){
          const vals = parseCsvLine(lines[i]);
          const obj = {id:uid(), dateAdded:new Date().toISOString(), tags:[]};
          cols.forEach((c,idx)=>obj[c]=vals[idx]);
          if(obj.rating) obj.rating = parseInt(obj.rating)||0;
          if(obj.seriesNumber) obj.seriesNumber = parseFloat(obj.seriesNumber);
          obj.favorite = obj.favorite==='true'||obj.favorite===true;
          obj.signed = obj.signed==='true'||obj.signed===true;
          obj.firstEdition = obj.firstEdition==='true'||obj.firstEdition===true;
          if(obj.title) state.books.push(obj);
        }
      }
      saveBooks(); saveWishlist(); saveSeriesMeta(); render();
      toast('Import complete');
    }catch(err){ toast('Import failed — check the file format'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function parseCsvLine(line){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch === '"' && line[i+1] === '"'){ cur+='"'; i++; }
      else if(ch === '"'){ inQ=false; }
      else cur += ch;
    } else {
      if(ch === '"') inQ=true;
      else if(ch === ','){ out.push(cur); cur=''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

/* ============== INIT ============== */
loadAll();
